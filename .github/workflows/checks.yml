name: Checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        run: bash -n install.sh full_install.sh cleanup.sh panel_src/update_cores.sh proxy_panel/install.sh proxy_panel/balancer.sh proxy_panel/check-client.sh
      - name: Check web installer
        run: python3 -m py_compile web_installer.py && python3 tests/test_web_installer.py
      - name: Check PHP syntax
        run: find panel_src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: node --check panel_src/assets/js/main.js && node --check proxy_panel/server.js
  relay-install-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install relay on a fresh runner
        run: |
          sudo bash proxy_panel/install.sh > /tmp/relay-install.log 2>&1 || {
            tail -n 80 /tmp/relay-install.log
            exit 1
          }
          if ! sudo systemctl is-active --quiet openvpn@server.service; then
            sudo journalctl -u openvpn@server.service -n 80 --no-pager
            exit 1
          fi
          if ! sudo systemctl is-active --quiet vpn-relay-panel.service; then
            sudo journalctl -u vpn-relay-panel.service -n 80 --no-pager
            exit 1
          fi
      - name: Check relay API
        run: |
          token=$(sudo jq -r .apiToken /opt/vpn-relay/settings.json)
          pin=$(sudo openssl x509 -in /opt/vpn-relay/tls.crt -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)
          ready=false
          for attempt in {1..20}; do
            if curl --silent --fail --insecure --header "Authorization: Bearer $token" https://127.0.0.1:8443/api/status > /tmp/relay-status.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            sudo systemctl status vpn-relay-panel.service --no-pager || true
            sudo journalctl -u vpn-relay-panel.service -n 40 --no-pager
            exit 1
          fi
          served_pin=$(echo | openssl s_client -connect 127.0.0.1:8443 -servername 127.0.0.1 2>/dev/null | openssl x509 -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)
          test "$pin" = "$served_pin"
          jq -e '.openvpn == true and .paired == false' /tmp/relay-status.json
